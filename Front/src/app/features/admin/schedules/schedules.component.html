<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <app-sidebar class="flex-shrink-0"></app-sidebar>

  <!-- Contenido principal -->
  <main class="flex-1 overflow-auto flex flex-col">
    <!-- Header -->
    <app-header [title]="'Horarios'" [subtitle]="'Gestión de horarios'" [buttonText]="'Exportar'" [icon]="'download'" (buttonClick)="exportSchedules()"></app-header>

    <div class="p-6 space-y-6 flex-1">
      <!-- Filtros y búsqueda -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <input type="text" placeholder="Buscar horario..."
               class="flex-1 p-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <div class="flex gap-2">
          <select class="p-3 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Todos los empleados</option>
            <option *ngFor="let schedule of schedules" [value]="schedule.employee">{{ schedule.employee }}</option>
          </select>
        </div>
      </div>

      <!-- Tabla de horarios -->
      <div class="bg-white rounded-xl shadow border border-gray-100 overflow-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Empleado</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Entrada</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Salida</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider justify-center">Acciones</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let schedule of schedules">
              <td class="px-6 py-4 whitespace-nowrap text-gray-800">{{ schedule.employee }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-gray-600">{{ schedule.date | date:'shortDate' }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-gray-800">{{ schedule.checkIn }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-gray-800">{{ schedule.checkOut }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium flex justify-center gap-2">
                
                <!-- Botón Editar -->
                <button
                  class="flex items-center gap-1 px-3 py-1 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition"
                  (click)="editarHorario(schedule)"
                >
                  <i class="material-icons text-base">edit</i>
                  <span class="hidden sm:inline">Editar</span>
                </button>

                <!-- Botón Eliminar -->
                <button
                  class="flex items-center gap-1 px-3 py-1 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition"
                  (click)="eliminarHorario(schedule)"
                >
                  <i class="material-icons text-base">delete</i>
                  <span class="hidden sm:inline">Eliminar</span>
                </button>

              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div class="flex justify-end mt-4 space-x-2">
        <button class="px-3 py-1 bg-gray-100 rounded hover:bg-gray-200">&lt;</button>
        <button class="px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">1</button>
        <button class="px-3 py-1 bg-gray-100 rounded hover:bg-gray-200">2</button>
        <button class="px-3 py-1 bg-gray-100 rounded hover:bg-gray-200">&gt;</button>
      </div>
    </div>
  </main>
</div>
