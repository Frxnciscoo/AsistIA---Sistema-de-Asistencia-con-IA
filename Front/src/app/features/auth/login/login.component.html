<div class="flex h-screen relative overflow-hidden">
  <!-- Lado izquierdo (fondo degradado + imagen con overlay oscuro) -->
  <div class="hidden md:flex w-1/2 relative bg-gradient-to-b from-blue-500 via-blue-400 to-blue-300">
    
    <!-- Overlay detrás de la persona -->
    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[500px] h-[500px] 
                bg-gradient-to-t from-black/40 via-blue-900/30 to-transparent rounded-full blur-2xl z-0">
    </div>

    <!-- Imagen centrada abajo y fija -->
    <img 
      src="assets/img/loginImg2.png"
      alt="Imagen biométrica"
      class="absolute bottom-0 left-1/2 -translate-x-1/2 max-w-[800px] w-full h-auto 
             object-contain drop-shadow-3xl brightness-95 contrast-125 z-10"
    />
  </div>

  <!-- Lado derecho (login) -->
  <div class="flex w-full md:w-1/2 items-center justify-center px-6 bg-white">
    <div class="w-full max-w-md p-8 bg-white/90 backdrop-blur-xl rounded-2xl ">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-r from-[#3b82f6] to-[#2563eb] text-white rounded-full mb-4 shadow-lg">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 
                     00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <h2 class="text-4xl font-bold text-gray-800 mb-1">Bienvenido</h2>
      </div>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Usuario -->
        
        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
          <input
            type="text"
            formControlName="correo"
            placeholder="Usuario"
            class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-[#3b82f6] 
                   focus:border-[#3b82f6] outline-none text-gray-700 transition"
          />
        </div>

        <!-- Contraseña -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="contrasena"
              placeholder="••••••••"
              class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-[#3b82f6] 
                     focus:border-[#3b82f6] outline-none text-gray-700 transition"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#2563eb] transition"
            >
              <!-- Ojo cerrado -->
              <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M2.458 12C3.732 7.943 7.523 5 12 
                         5c4.478 0 8.268 2.943 9.542 7-1.274 
                         4.057-5.064 7-9.542 
                         7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <!-- Ojo tachado -->
              <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M13.875 18.825A10.05 10.05 0 0112 
                         19c-4.478 0-8.268-2.943-9.543-7a9.97 
                         9.97 0 011.563-3.029"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M9.878 9.878a3 3 0 114.243 
                         4.243M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botón -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="w-full bg-gradient-to-r from-[#3b82f6] to-[#2563eb] text-white py-2.5 rounded-lg font-semibold 
                 hover:from-[#2563eb] hover:to-[#1e40af] focus:ring-2 focus:ring-[#3b82f6] 
                 shadow-md transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span *ngIf="!isLoading">Iniciar sesión</span>
          <span *ngIf="isLoading">Cargando...</span>
        </button>

        <!-- Error -->
        <div *ngIf="errorMessage" 
             class="p-3 text-sm text-red-700 bg-red-50 rounded-md border border-red-200">
          {{ errorMessage }}
        </div>
      </form>

      <!-- Registro -->
      <div class="mt-6 text-center text-sm">
        <span class="text-gray-600">¿No tienes una cuenta?</span>
        <a href="#" class="text-[#3b82f6] font-semibold hover:underline ml-1">Regístrate aquí</a>
      </div>
    </div>
  </div>
</div>

<!-- Logo en la parte superior izquierda -->
<div class="absolute top-4 left-6 z-50 flex items-center space-x-2">
  <img 
    src="assets/img/logoAsistenciaWhite.png" 
    alt="Logo" 
    class="h-28 w-auto"
  />
</div>
