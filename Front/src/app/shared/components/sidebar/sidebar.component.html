<!-- Contenedor general -->
<div class="flex h-screen bg-gray-100">

  <!-- Sidebar Desktop -->
  <aside
    class="hidden md:flex flex-col bg-white shadow-lg transition-all duration-300"
    [class.w-64]="isOpen"
    [class.w-14]="!isOpen"
  >
    <!-- Logo -->
    <div class="flex items-center justify-between p-4 border-b">
      <img
        src="assets/img/logoAsistencIA.png"
        alt="Logo"
        class="h-12 w-auto"
        *ngIf="isOpen"
      />
      <button
        (click)="toggleSidebar()"
        class="  text-gray-600 hover:text-blue-600 flex"
      >
        <i class="material-icons">menu</i>
      </button>
    </div>

    <!-- Menú dinámico -->
    <nav class="flex-1 px-2 py-4 space-y-2">
      <a *ngFor="let item of menus"
        [routerLink]="item.link"
        routerLinkActive="bg-blue-100 text-blue-600"
        class="flex items-center p-2 rounded-lg hover:bg-blue-50 transition-colors">
        <i class="material-icons mr-3">{{ item.icon }}</i>
        <span *ngIf="isOpen">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Botón Logout -->
    <div class="p-4 border-t">
      <button (click)="modalLogout()"
        class="w-full flex items-center p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors">
        <i class="material-icons mr-3">logout</i>
        <span *ngIf="isOpen">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

    <main class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </main>

</div>

<!-- Modal Logout -->
<app-modal
  [isOpen]="isModalOpen"  
  [title]="'Cerrar Sesión'" 
  (close)="closeModal()"> 
  <div class="space-y-2 overflow-auto max-h-[70vh]">  
    <p class="text-gray-700">
      ¿Estás seguro que deseas cerrar sesión?
    </p>
    <button 
      class="w-full flex items-center p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
      (click)="logout(); closeModal()">
      <i class="material-icons mr-3">logout</i>
      <span *ngIf="isOpen">Cerrar Sesión</span>
    </button>
  </div>
</app-modal>
