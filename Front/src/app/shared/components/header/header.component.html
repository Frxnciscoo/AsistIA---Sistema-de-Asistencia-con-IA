<header 
  [ngClass]="classes" 
  class="bg-white border-b border-gray-200 p-6 sticky top-0 z-10 flex justify-between items-center shadow-sm">

  <!-- Título y subtítulo -->
  <div>
    <h1 class="text-3xl font-bold text-gray-800 mb-1">
      {{ title }}
    </h1>
    <p *ngIf="subtitle" class="text-gray-600">
      {{ subtitle }}
    </p>
  </div>

  <!-- Botón de acción -->
  <button 
    *ngIf="buttonText" 
    (click)="onButtonClick()"
    class="flex items-center space-x-2 px-4 py-2 rounded-lg transition-all duration-200
           bg-blue-600 text-white hover:bg-blue-700 focus:ring-2 focus:ring-blue-400 focus:outline-none">
    <i *ngIf="icon" class="material-icons">{{ icon }}</i>   

    <span>{{ buttonText }}</span>
  </button>
</header>
